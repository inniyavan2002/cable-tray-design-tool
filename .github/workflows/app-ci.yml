name: App CI

on:
  push:
    paths:
      - 'app/**'
      - 'pdfs/**'
      - 'tool.html'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'pdfs/**'
      - 'tool.html'
      - '.github/workflows/app-ci.yml'
  # Run by hand, for instance to publish the website right after GitHub Pages is switched on.
  workflow_dispatch:

# A newer push cancels a run in progress, except on main, where runs wait their turn so a deployment is never cut short.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:speed
      - run: npm run build:all
      - run: npm run verify

      - name: Install Playwright browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e

      # The product website, with the app at app/ and the sample reports the browser tests just wrote.
      - run: npm run build:site
      - run: npm run verify:site
      - run: npm run test:site

      # The website as GitHub Pages serves it, once every check above has passed; from main only.
      - name: Upload website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist-site

      - name: Upload single-file build
        uses: actions/upload-artifact@v7
        with:
          name: CableTrayDesign-single-file
          path: app/dist-single/CableTrayDesign.html

      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/playwright-report-site

  # Publishes the website checked above to GitHub Pages. The repository's
  # Settings, Pages, Source must be set to "GitHub Actions".
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
