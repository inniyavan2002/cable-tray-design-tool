name: App CI

on:
  push:
    paths:
      - 'app/**'
      - 'pdfs/**'
      - 'tool.html'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'pdfs/**'
      - 'tool.html'
      - '.github/workflows/app-ci.yml'

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:speed
      - run: npm run build:all
      - run: npm run verify

      - name: Install Playwright browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e

      # The product website, with the app at app/ and the sample reports the browser tests just wrote.
      - run: npm run build:site
      - run: npm run verify:site
      - run: npm run test:site

      - name: Upload single-file build
        uses: actions/upload-artifact@v7
        with:
          name: CableTrayDesign-single-file
          path: app/dist-single/CableTrayDesign.html

      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/playwright-report-site
